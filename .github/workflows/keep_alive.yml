name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 4 hours automatically
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive ping
        run: |
          curl -s -m 15 -A "Mozilla/5.0" "https://ali-mehdi-pdac.streamlit.app/" -o /dev/null -w "HTTP Status: %{http_code}\n"
          echo "Keep-alive ping dispatched successfully."
